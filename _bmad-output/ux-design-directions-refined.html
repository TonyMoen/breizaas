<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breizaas - Refined Design Direction Variations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Trade+Winds&family=Montserrat:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg-primary: #0f0f1a;
        --bg-card: #1f1f2e;
        --bg-navy: #1a1a2e;
        --text-white: #ffffff;
        --text-light-gray: #e8e8e8;
        --text-med-gray: #a0a0a0;
        --neon-purple: #c77dff;
        --neon-purple-vibrant: #e539ff;
        --neon-pink: #ff006e;
        --neon-pink-hot: #ff1493;
        --gold-champagne: #d4af37;
        --gold-light: #f4e4c1;
        --spotify-green: #1db954;
        --purple-playful: #d896ff;
        --purple-liggi: #e0a3ff;
        --gold-cream: #f5e6d3;
        --gold-vintage: #d4a574;
        --amber-warm: #ffb84d;
        --bg-warm-dark: #2a1f1a;
        --bg-warm-medium: #3d2f26;
        --bg-warm-light: #4a3a2e;
        --bg-cream: #f5e6d3;
        --bg-cream-dark: #e8d4bc;
        --bg-beige: #d4c4b0;
        --bg-brown-soft: #5c4a3a;
        --bg-amber-dark: #1a1410;
        --text-dark-brown: #2a1f1a;
        --bg-plum-dark: #2d1b2e;
        --bg-plum-card: #3d2a3e;
        --bg-twilight: #1a1f28;
        --bg-twilight-card: #252a35;
        --bg-twilight-navy: #1f2430;
        --font-brand: "Trade Winds", cursive;
        --font-headline: "Montserrat", sans-serif;
        --font-body: "Inter", sans-serif;
      }

      body {
        font-family: var(--font-body);
        background-color: var(--bg-primary);
        color: var(--text-white);
        line-height: 1.6;
        overflow-x: hidden;
      }

      .container {
        max-width: 1440px;
        margin: 0 auto;
        padding: 0 24px;
      }

      /* Direction Selector */
      .direction-selector {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: rgba(15, 15, 26, 0.95);
        backdrop-filter: blur(10px);
        padding: 16px;
        z-index: 1000;
        border-bottom: 1px solid rgba(199, 125, 255, 0.2);
      }

      .direction-selector h2 {
        font-family: var(--font-headline);
        font-size: 14px;
        color: var(--text-light-gray);
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .direction-buttons {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .direction-btn {
        background: var(--bg-card);
        border: 1px solid rgba(199, 125, 255, 0.3);
        color: var(--text-light-gray);
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-family: var(--font-body);
        font-size: 13px;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .direction-btn:hover {
        background: var(--bg-navy);
        border-color: var(--neon-purple);
        box-shadow: 0 0 20px rgba(199, 125, 255, 0.4);
      }

      .direction-btn.active {
        background: var(--neon-purple);
        color: var(--bg-primary);
        border-color: var(--neon-purple);
        box-shadow: 0 0 30px rgba(199, 125, 255, 0.6);
      }

      /* Mockup Container */
      .mockup-container {
        margin-top: 120px;
        min-height: 100vh;
      }

      .mockup {
        display: none;
        animation: fadeIn 0.5s ease;
      }

      .mockup.active {
        display: block;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Navigation */
      .nav {
        padding: 24px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .nav-brand {
        font-family: var(--font-brand);
        font-size: 28px;
        letter-spacing: 2px;
      }

      .nav-links {
        display: flex;
        gap: 32px;
        list-style: none;
      }

      .nav-link {
        font-family: var(--font-body);
        font-weight: 500;
        font-size: 14px;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.3s ease;
        padding: 8px 0;
        position: relative;
      }

      .nav-link::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0;
        height: 2px;
        transition: width 0.3s ease;
      }

      .nav-link:hover::after {
        width: 100%;
      }

      /* Hero Section */
      .hero {
        text-align: center;
        padding: 96px 0;
      }

      .hero-subtitle {
        font-family: var(--font-headline);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 3px;
        margin-bottom: 24px;
        font-weight: 600;
      }

      .hero-title {
        font-family: var(--font-headline);
        font-size: 96px;
        font-weight: 900;
        line-height: 1;
        margin-bottom: 32px;
        text-transform: uppercase;
        letter-spacing: -2px;
      }

      .hero-description {
        font-family: var(--font-body);
        font-size: 18px;
        line-height: 1.8;
        max-width: 600px;
        margin: 0 auto 48px;
      }

      .hero-cta {
        display: inline-flex;
        gap: 16px;
      }

      .btn {
        padding: 16px 32px;
        border-radius: 8px;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        border: 2px solid;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      /* Tour Grid */
      .tour-grid {
        padding: 64px 0;
      }

      .tour-grid h2 {
        font-family: var(--font-headline);
        font-size: 48px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 48px;
        text-transform: uppercase;
        letter-spacing: -1px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 24px;
      }

      .tour-card {
        background: var(--bg-card);
        border-radius: 16px;
        padding: 32px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .tour-card:hover {
        transform: translateY(-4px);
      }

      .tour-date {
        font-family: var(--font-headline);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 16px;
      }

      .tour-venue {
        font-family: var(--font-headline);
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .tour-location {
        font-family: var(--font-body);
        font-size: 14px;
        margin-bottom: 24px;
      }

      .tour-card .btn {
        width: 100%;
        text-align: center;
      }

      /* Info Panel */
      .info-panel {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: rgba(31, 31, 46, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(199, 125, 255, 0.3);
        border-radius: 12px;
        padding: 20px;
        max-width: 320px;
        z-index: 999;
      }

      .info-panel h3 {
        font-family: var(--font-headline);
        font-size: 14px;
        color: var(--neon-purple);
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .info-panel p {
        font-size: 12px;
        line-height: 1.6;
        color: var(--text-med-gray);
      }

      /* Color Variations */

      /* Variation 1: Pink Hero + Gold Accents */
      .variation-1 .nav-brand {
        color: var(--neon-pink);
        text-shadow: 0 0 30px rgba(255, 0, 110, 0.6);
      }

      .variation-1 .nav-link {
        color: var(--gold-light);
      }

      .variation-1 .nav-link:hover {
        color: var(--neon-pink);
      }

      .variation-1 .nav-link::after {
        background: var(--neon-pink);
      }

      .variation-1 .hero-subtitle {
        color: var(--gold-champagne);
      }

      .variation-1 .hero-title {
        color: var(--neon-pink);
        text-shadow: 0 0 50px rgba(255, 0, 110, 0.5);
      }

      .variation-1 .hero-description {
        color: var(--gold-light);
      }

      .variation-1 .btn-primary {
        background: var(--neon-pink);
        border-color: var(--neon-pink);
        color: var(--bg-primary);
      }

      .variation-1 .btn-primary:hover {
        box-shadow: 0 0 30px rgba(255, 0, 110, 0.6);
      }

      .variation-1 .btn-secondary {
        background: transparent;
        border-color: var(--gold-champagne);
        color: var(--gold-champagne);
      }

      .variation-1 .btn-secondary:hover {
        background: var(--gold-champagne);
        color: var(--bg-primary);
      }

      .variation-1 .tour-grid h2 {
        color: var(--neon-pink);
      }

      .variation-1 .tour-card {
        border-color: rgba(255, 0, 110, 0.2);
      }

      .variation-1 .tour-card:hover {
        border-color: var(--neon-pink);
        box-shadow: 0 10px 40px rgba(255, 0, 110, 0.3);
      }

      .variation-1 .tour-date {
        color: var(--gold-champagne);
      }

      .variation-1 .tour-venue {
        color: var(--text-white);
      }

      .variation-1 .tour-location {
        color: var(--text-med-gray);
      }

      .variation-1 .tour-card .btn {
        background: var(--neon-pink);
        border-color: var(--neon-pink);
        color: var(--bg-primary);
      }

      .variation-1 .tour-card .btn:hover {
        box-shadow: 0 0 25px rgba(255, 0, 110, 0.5);
      }

      /* Variation 2: Pink + Purple Gradient Hero */
      .variation-2 .nav-brand {
        background: linear-gradient(
          135deg,
          var(--neon-pink),
          var(--neon-purple-vibrant)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .variation-2 .nav-link {
        color: var(--text-light-gray);
      }

      .variation-2 .nav-link:hover {
        color: var(--neon-pink);
      }

      .variation-2 .nav-link::after {
        background: linear-gradient(
          90deg,
          var(--neon-pink),
          var(--neon-purple)
        );
      }

      .variation-2 .hero-subtitle {
        color: var(--neon-purple);
      }

      .variation-2 .hero-title {
        background: linear-gradient(
          135deg,
          var(--neon-pink),
          var(--neon-purple-vibrant)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 30px rgba(255, 0, 110, 0.4));
      }

      .variation-2 .hero-description {
        color: var(--gold-light);
      }

      .variation-2 .btn-primary {
        background: linear-gradient(
          135deg,
          var(--neon-pink),
          var(--neon-purple)
        );
        border-color: transparent;
        color: var(--text-white);
      }

      .variation-2 .btn-primary:hover {
        box-shadow: 0 0 40px rgba(255, 0, 110, 0.6);
      }

      .variation-2 .btn-secondary {
        background: transparent;
        border-color: var(--gold-champagne);
        color: var(--gold-champagne);
      }

      .variation-2 .btn-secondary:hover {
        background: var(--gold-champagne);
        color: var(--bg-primary);
      }

      .variation-2 .tour-grid h2 {
        color: var(--neon-pink);
      }

      .variation-2 .tour-card {
        border-color: rgba(199, 125, 255, 0.2);
      }

      .variation-2 .tour-card:hover {
        border-color: var(--neon-purple);
        box-shadow: 0 10px 40px rgba(199, 125, 255, 0.3);
      }

      .variation-2 .tour-date {
        color: var(--gold-champagne);
      }

      .variation-2 .tour-venue {
        color: var(--neon-pink);
      }

      .variation-2 .tour-location {
        color: var(--text-med-gray);
      }

      .variation-2 .tour-card .btn {
        background: var(--neon-purple);
        border-color: var(--neon-purple);
        color: var(--text-white);
      }

      .variation-2 .tour-card .btn:hover {
        box-shadow: 0 0 25px rgba(199, 125, 255, 0.6);
      }

      /* Variation 3: Hot Pink + Minimal Gold */
      .variation-3 .nav-brand {
        color: var(--neon-pink-hot);
        text-shadow: 0 0 40px rgba(255, 20, 147, 0.7);
      }

      .variation-3 .nav-link {
        color: var(--text-light-gray);
      }

      .variation-3 .nav-link:hover {
        color: var(--neon-pink-hot);
      }

      .variation-3 .nav-link::after {
        background: var(--neon-pink-hot);
      }

      .variation-3 .hero-subtitle {
        color: var(--text-med-gray);
      }

      .variation-3 .hero-title {
        color: var(--neon-pink-hot);
        text-shadow: 0 0 60px rgba(255, 20, 147, 0.6);
      }

      .variation-3 .hero-description {
        color: var(--gold-light);
        font-size: 16px;
      }

      .variation-3 .btn-primary {
        background: var(--neon-pink-hot);
        border-color: var(--neon-pink-hot);
        color: var(--bg-primary);
      }

      .variation-3 .btn-primary:hover {
        box-shadow: 0 0 40px rgba(255, 20, 147, 0.7);
      }

      .variation-3 .btn-secondary {
        background: transparent;
        border-color: var(--text-med-gray);
        color: var(--text-light-gray);
      }

      .variation-3 .btn-secondary:hover {
        background: var(--text-light-gray);
        color: var(--bg-primary);
      }

      .variation-3 .tour-grid h2 {
        color: var(--text-white);
      }

      .variation-3 .tour-card {
        border-color: rgba(255, 255, 255, 0.1);
      }

      .variation-3 .tour-card:hover {
        border-color: var(--neon-pink-hot);
        box-shadow: 0 10px 40px rgba(255, 20, 147, 0.4);
      }

      .variation-3 .tour-date {
        color: var(--gold-champagne);
        font-size: 12px;
      }

      .variation-3 .tour-venue {
        color: var(--text-white);
      }

      .variation-3 .tour-location {
        color: var(--text-med-gray);
      }

      .variation-3 .tour-card .btn {
        background: transparent;
        border-color: var(--neon-pink-hot);
        color: var(--neon-pink-hot);
      }

      .variation-3 .tour-card .btn:hover {
        background: var(--neon-pink-hot);
        color: var(--bg-primary);
        box-shadow: 0 0 25px rgba(255, 20, 147, 0.5);
      }

      /* Variation 4: Pink Hero + Purple Accents + Gold Body */
      .variation-4 .nav-brand {
        color: var(--neon-pink);
        text-shadow: 0 0 30px rgba(255, 0, 110, 0.6);
      }

      .variation-4 .nav-link {
        color: var(--neon-purple);
      }

      .variation-4 .nav-link:hover {
        color: var(--neon-pink);
      }

      .variation-4 .nav-link::after {
        background: var(--neon-pink);
      }

      .variation-4 .hero-subtitle {
        color: var(--neon-purple);
      }

      .variation-4 .hero-title {
        color: var(--neon-pink);
        text-shadow: 0 0 50px rgba(255, 0, 110, 0.5);
      }

      .variation-4 .hero-description {
        color: var(--gold-light);
        font-weight: 400;
      }

      .variation-4 .btn-primary {
        background: var(--neon-pink);
        border-color: var(--neon-pink);
        color: var(--bg-primary);
      }

      .variation-4 .btn-primary:hover {
        box-shadow: 0 0 30px rgba(255, 0, 110, 0.6);
      }

      .variation-4 .btn-secondary {
        background: transparent;
        border-color: var(--neon-purple);
        color: var(--neon-purple);
      }

      .variation-4 .btn-secondary:hover {
        background: var(--neon-purple);
        color: var(--text-white);
        box-shadow: 0 0 25px rgba(199, 125, 255, 0.5);
      }

      .variation-4 .tour-grid h2 {
        color: var(--text-white);
      }

      .variation-4 .tour-card {
        border-color: rgba(199, 125, 255, 0.2);
      }

      .variation-4 .tour-card:hover {
        border-color: var(--neon-purple);
        box-shadow: 0 10px 40px rgba(199, 125, 255, 0.3);
      }

      .variation-4 .tour-date {
        color: var(--gold-champagne);
      }

      .variation-4 .tour-venue {
        color: var(--neon-pink);
      }

      .variation-4 .tour-location {
        color: var(--gold-light);
      }

      .variation-4 .tour-card .btn {
        background: transparent;
        border-color: var(--neon-purple);
        color: var(--neon-purple);
      }

      .variation-4 .tour-card .btn:hover {
        background: var(--neon-purple);
        color: var(--text-white);
        box-shadow: 0 0 25px rgba(199, 125, 255, 0.5);
      }

      /* Variation 5: Vibrant Pink + White + Gold Hints */
      .variation-5 .nav-brand {
        color: var(--neon-pink-hot);
        text-shadow: 0 0 40px rgba(255, 20, 147, 0.7);
      }

      .variation-5 .nav-link {
        color: var(--text-white);
      }

      .variation-5 .nav-link:hover {
        color: var(--gold-champagne);
      }

      .variation-5 .nav-link::after {
        background: var(--gold-champagne);
      }

      .variation-5 .hero-subtitle {
        color: var(--gold-champagne);
        font-size: 12px;
      }

      .variation-5 .hero-title {
        color: var(--neon-pink-hot);
        text-shadow: 0 0 60px rgba(255, 20, 147, 0.6);
      }

      .variation-5 .hero-description {
        color: var(--text-white);
      }

      .variation-5 .btn-primary {
        background: var(--neon-pink-hot);
        border-color: var(--neon-pink-hot);
        color: var(--text-white);
      }

      .variation-5 .btn-primary:hover {
        box-shadow: 0 0 40px rgba(255, 20, 147, 0.7);
      }

      .variation-5 .btn-secondary {
        background: transparent;
        border-color: var(--gold-champagne);
        color: var(--gold-champagne);
      }

      .variation-5 .btn-secondary:hover {
        background: var(--gold-champagne);
        color: var(--bg-primary);
      }

      .variation-5 .tour-grid h2 {
        color: var(--text-white);
      }

      .variation-5 .tour-card {
        border-color: rgba(255, 255, 255, 0.15);
      }

      .variation-5 .tour-card:hover {
        border-color: var(--gold-champagne);
        box-shadow: 0 10px 40px rgba(212, 175, 55, 0.3);
      }

      .variation-5 .tour-date {
        color: var(--gold-champagne);
        font-size: 12px;
      }

      .variation-5 .tour-venue {
        color: var(--text-white);
      }

      .variation-5 .tour-location {
        color: var(--text-med-gray);
      }

      .variation-5 .tour-card .btn {
        background: transparent;
        border-color: var(--text-white);
        color: var(--text-white);
      }

      .variation-5 .tour-card .btn:hover {
        background: var(--neon-pink-hot);
        border-color: var(--neon-pink-hot);
        color: var(--text-white);
        box-shadow: 0 0 25px rgba(255, 20, 147, 0.5);
      }

      /* Variation 6: "Liggi" - Warm Vintage Gold + Playful Purple */
      .variation-6 .nav-brand {
        color: var(--gold-cream);
        text-shadow: -1px -1px 0 var(--gold-vintage),
          1px -1px 0 var(--gold-vintage), -1px 1px 0 var(--gold-vintage),
          1px 1px 0 var(--gold-vintage), 0 0 30px rgba(212, 165, 116, 0.5);
      }

      .variation-6 .nav-link {
        color: var(--gold-cream);
      }

      .variation-6 .nav-link:hover {
        color: var(--purple-playful);
      }

      .variation-6 .nav-link::after {
        background: var(--purple-liggi);
      }

      .variation-6 .hero-subtitle {
        color: var(--amber-warm);
        font-size: 12px;
      }

      .variation-6 .hero-title {
        color: var(--gold-cream);
        text-shadow: -2px -2px 0 var(--gold-vintage),
          2px -2px 0 var(--gold-vintage), -2px 2px 0 var(--gold-vintage),
          2px 2px 0 var(--gold-vintage), 0 0 40px rgba(212, 165, 116, 0.6);
        font-weight: 900;
      }

      .variation-6 .hero-description {
        color: var(--text-light-gray);
      }

      .variation-6 .btn-primary {
        background: var(--purple-playful);
        border-color: var(--purple-playful);
        color: var(--bg-primary);
        font-weight: 700;
      }

      .variation-6 .btn-primary:hover {
        background: var(--purple-liggi);
        box-shadow: 0 0 35px rgba(216, 150, 255, 0.7);
      }

      .variation-6 .btn-secondary {
        background: transparent;
        border-color: var(--gold-vintage);
        color: var(--gold-cream);
      }

      .variation-6 .btn-secondary:hover {
        background: var(--gold-vintage);
        color: var(--bg-primary);
      }

      .variation-6 .tour-grid h2 {
        color: var(--gold-cream);
        text-shadow: 0 0 20px rgba(212, 165, 116, 0.4);
